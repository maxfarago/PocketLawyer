[project]
name = "pl2016"
version = "0.1.0"
description = "Pocket Lawyer rebuilt with 2016-era retrieval techniques."
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "flask==3.1.3",
    "huggingface_hub==1.32.0",
    "joblib==1.6.0",
    "nltk==3.10.3",
    "numpy==2.5.3",
    "pymongo==4.18.1",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pl2016*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# This config lives under 2016/ so it never sees the 2016 notebook or README at the repo root.
line-length = 100
target-version = "py312"
